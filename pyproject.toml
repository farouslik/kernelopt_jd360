[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "farouslik-kernelopt_jd360"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对AI 芯片算子优化工程师·函数调用的 schema 校验相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "farouslik" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://farouslik.github.io"
Repository = "https://github.com/farouslik/kernelopt_jd360"
Issues = "https://github.com/farouslik/kernelopt_jd360/issues"

[project.scripts]
kernelopt_jd360 = "kernelopt_jd360:main"

[tool.setuptools]
py-modules = ["kernelopt_jd360"]
